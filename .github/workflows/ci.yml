name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THINC_TEST_DATABASE_URL: postgresql+psycopg://thinc_migrator:migration@localhost:5432/thinc_test
      THINC_TEST_APP_DATABASE_URL: postgresql+psycopg://thinc_app:application@localhost:5432/thinc_test
      THINC_TEST_DATABASE_DISPOSABLE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Provision PostgreSQL roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres <<'SQL'
          CREATE ROLE thinc_migrator
            LOGIN PASSWORD 'migration'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE thinc_app
            LOGIN PASSWORD 'application'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE DATABASE thinc_test OWNER thinc_migrator;
          SQL

      - name: Run quality gate
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest --cov=thinc_v5 --cov-fail-under=90
          bandit -r src
          pip-audit
