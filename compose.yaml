services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: thinc
      POSTGRES_USER: thinc
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - thinc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinc -d thinc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  thinc-postgres-data:
