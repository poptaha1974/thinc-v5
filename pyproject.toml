[build-system]
requires = ["hatchling~=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "thinc-v5"
version = "0.1.0"
description = "THINC v5 foundation package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic~=1.16.0",
    "fastapi~=0.116.0",
    "psycopg[binary]~=3.2.0",
    "pydantic~=2.12.0",
    "sqlalchemy~=2.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit~=1.8.0",
    "hypothesis~=6.140.0",
    "httpx~=0.28.0",
    "mypy~=1.18.0",
    "pip-audit~=2.9.0",
    "pytest~=9.1.0",
    "pytest-cov~=7.0.0",
    "ruff~=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thinc_v5"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["thinc_v5"]

[tool.coverage.report]
fail_under = 90
show_missing = true
